name: fetch-articles
on:
  schedule: [{cron: "0 6 * * *"}]   # daily, 06:00 UTC
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests && python fetch.py
      - run: |
          git config user.name "journal-bot"
          git config user.email "journal-bot@users.noreply.github.com"
          git add articles.json
          git diff --staged --quiet || (git commit -m "Update articles" && git pull --rebase --autostash && git push)
